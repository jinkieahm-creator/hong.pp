<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홍어진 — 1페이지 요약</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1d1424;--sub:#5a4a63;--line:#e3d6dc;--bg:#fbf5f1;--gold:#c9772f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.7 Pretendard Variable,Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.sheet{max-width:860px;margin:0 auto;padding:clamp(20px,5vw,48px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.bar a,.bar button{font:600 14px inherit;padding:9px 16px;border-radius:99px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.bar a:focus-visible,.bar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2}
.role{color:var(--sub);font-weight:600;margin-top:4px}
.contact{margin-top:6px;font-size:15px}
h2{margin:30px 0 10px;font-size:13px;letter-spacing:.12em;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px}
.pj{padding:16px 0;border-bottom:1px solid var(--line)}
.pj h3{font-size:20px}.pj h3 small{font-size:13px;color:var(--sub);font-weight:600;margin-left:8px}
.pj p{margin-top:6px}.pj .m{font-size:14px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;list-style:none}
.chips li{font-size:13px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;background:#fff}
.pj .l{margin-top:8px;font-size:14px}.pj .l a{color:var(--ink);margin-right:14px}
.note{margin-top:26px;font-size:13px;color:var(--sub)}
ul.plain{list-style:none}ul.plain li{padding:3px 0;font-size:15px}
@media print{body{background:#fff}.bar{display:none}.sheet{padding:0;max-width:none}.pj{break-inside:avoid}}
</style>
</head>
<body>
<main class="sheet" id="s"></main>
<script src="js/data.js"></script>
<script>
const D = window.CIM_DATA
const li = (a) => a.map((t) => `<li>${t}</li>`).join("")
document.getElementById("s").innerHTML = `
<div class="bar"><a href="index.html">← 포트폴리오로</a><button type="button" onclick="print()">인쇄 / PDF 저장</button></div>
<h1>${D.person.name}</h1>
<p class="role">신입 UI/UX 디자이너 · 웹 퍼블리싱</p>
<p class="contact"><a href="mailto:${D.person.mail}">${D.person.mail}</a></p>
<h2>SELECTED PROJECTS · 개인 프로젝트 ${D.works.length}편</h2>
${D.works.map((w) => { const o = (w.detail && w.detail.overview) || {}; return `
<article class="pj"><h3>${w.name}<small>${w.type} · ${w.period}</small></h3>
<p><b>${w.sub}</b></p>
<p>${o.goal || w.problem}</p>
<p class="m">역할: ${o.role || w.scope} · ${o.personal || ""}</p>
<ul class="chips">${li(w.stack)}</ul>
<p class="l"><a href="project.html?p=${w.id}">케이스 스터디</a><a href="${w.url}" target="_blank" rel="noopener">라이브 사이트 ↗</a></p></article>` }).join("")}
<h2>STUDIES · 개인 학습 및 재현 작업 ${D.studies.length}개</h2>
<ul class="plain">${D.studies.map((s) => `<li><b>${s.name}</b> · ${s.type} — ${s.layout}</li>`).join("")}</ul>
<h2>SKILLS</h2>
<ul class="plain"><li><b>DESIGN</b> ${D.skills.design.map((s) => s.name).join(" · ")}</li><li><b>DEVELOPMENT</b> ${D.skills.dev.map((s) => s.name).join(" · ")}</li><li><b>WORK PROCESS</b> ${D.skills.process.map((s) => s.name).join(" · ")}</li></ul>
<p class="note">※ 위 프로젝트는 모두 개인 작업입니다. 재현 작업의 원본 디자인 저작권은 각 원본 사이트에 있습니다. 사용성 테스트 결과와 수치 성과는 아직 없습니다.</p>`
</script>
</body>
</html>
