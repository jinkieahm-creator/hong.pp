<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홍어진 — 1페이지 요약 | UI/UX 디자이너 · 웹 퍼블리셔</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#0E0E0E;--mute:#66665F;--line:#dcdbd4;--bg:#F2F1EC;--lime:#C5FF00;--en:"Manrope","Pretendard Variable",Pretendard,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.7 "Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all}
.sheet{max-width:880px;margin:0 auto;padding:clamp(20px,5vw,56px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
.bar a,.bar button{font:700 14px/1 var(--en);padding:12px 18px;border-radius:99px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.bar button{background:var(--ink);color:#fff}
.bar a:focus-visible,.bar button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-bottom:22px;border-bottom:2px solid var(--ink)}
h1{font:800 clamp(40px,7vw,64px)/.9 var(--en);letter-spacing:-.05em}
h1 small{display:block;font:800 18px/1.4 "Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.02em;margin-top:10px}
.contact{text-align:right;font-size:14px}.contact a{color:inherit}
.lead{margin:22px 0 0;font-size:17px;font-weight:600}
h2{margin:34px 0 12px;font:800 12px/1 var(--en);letter-spacing:.16em;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);outline:1px solid var(--ink)}
.pj{display:grid;grid-template-columns:150px 1fr;gap:4px 20px;padding:16px 0;border-top:1px solid var(--line)}
.pj h3{font:800 22px/1.15 var(--en);letter-spacing:-.03em}
.pj .m{font-size:13px;color:var(--mute)}
.pj .b{grid-column:2}
.pj .b b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;list-style:none}
.chips li{font:700 12px/1 var(--en);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:#fff}
.links{margin-top:8px;font-size:13px}.links a{color:var(--ink);margin-right:14px;font-weight:700}
.rows{list-style:none}
.rows li{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:9px 0;border-top:1px solid var(--line)}
.rows small{font:700 13px/1.6 var(--en);color:var(--mute)}
.note{margin-top:30px;font-size:12px;color:var(--mute)}
@media (max-width:640px){.top{grid-template-columns:1fr}.contact{text-align:left}.pj,.rows li{grid-template-columns:1fr;gap:2px}.pj .b{grid-column:1}}
@media print{@page{margin:14mm}body{background:#fff;font-size:12.5px}.bar{display:none}.sheet{padding:0;max-width:none}.pj,.rows li{break-inside:avoid}h2{margin-top:20px}}
</style>
</head>
<body>
<main class="sheet" id="s"></main>
<script src="js/data.js"></script>
<script>
const D = window.CIM_DATA, P = D.person
const li = (a) => a.map((t) => `<li>${t}</li>`).join("")
document.getElementById("s").innerHTML = `
<div class="bar"><a href="index.html">← 포트폴리오로</a><button type="button" onclick="print()">인쇄 / PDF 저장</button></div>
<div class="top">
  <h1>${P.nameEn}<small>${P.name} · ${P.role}</small></h1>
  <p class="contact"><a href="mailto:${P.mail}">${P.mail}</a><br>${P.phone}</p>
</div>
<p class="lead">고객이 망설이는 순간을 보고, 망설임 없는 화면을 설계해 직접 코드로 완성합니다.</p>
<h2>SELECTED PROJECTS · 개인 프로젝트 ${D.works.length}편</h2>
${D.works.map((w) => { const o = (w.detail && w.detail.overview) || {}; return `
<article class="pj"><div><h3>${w.name}</h3><p class="m">${w.type}<br>${w.period}</p></div>
<div><b>${w.sub}</b><p>${o.goal || w.problem}</p><p class="m">역할 ${o.role || w.scope} · ${o.personal || ""}</p>
<ul class="chips">${li(w.stack)}</ul>
<p class="links"><a href="project.html?p=${w.id}">케이스 스터디 →</a><a href="${w.url}" target="_blank" rel="noopener">라이브 사이트 ↗</a></p></div></article>` }).join("")}
<h2>EXPERIENCE · CERTIFICATES</h2>
<ul class="rows">${D.career.map((c) => `<li><small>${c.period}</small><span><b>${c.title}</b><br>${c.text}</span></li>`).join("")}${D.certs.map((c) => `<li><small>${c.period}</small><b>${c.title}</b></li>`).join("")}</ul>
<h2>SKILLS</h2>
<ul class="rows"><li><small>DESIGN</small><span>${D.skills.design.map((s) => s.name).join(" · ")}</span></li><li><small>DEVELOPMENT</small><span>${D.skills.dev.map((s) => s.name).join(" · ")}</span></li><li><small>WORK PROCESS</small><span>${D.skills.process.map((s) => s.name).join(" · ")}</span></li></ul>
<h2>REBUILD STUDIES · 개인 학습 및 재현 작업 ${D.studies.length}개</h2>
<ul class="rows">${D.studies.map((s) => `<li><small>${s.name}</small><span>${s.type} — ${s.layout}</span></li>`).join("")}</ul>
<p class="note">※ 위 프로젝트는 모두 개인 작업입니다. 재현 작업의 원본 디자인 저작권은 각 원본 사이트에 있고, Marvel Universe는 비공식 팬 프로젝트로 Marvel 관련 명칭·캐릭터·포스터의 권리는 각 권리자에게 있습니다. 사용성 테스트 결과와 수치 성과는 아직 없습니다.</p>`
</script>
</body>
</html>
